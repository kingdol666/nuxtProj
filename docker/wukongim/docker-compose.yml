# ============================================================================
#  WuKongIM 单节点（开发环境）
# ============================================================================
#  启动：  cd docker/wukongim && docker compose up -d
#  健康检查：curl http://localhost:5001/health  →  {"status":"ok"}
#
#  端口：
#    5001  HTTP API（服务端调用：建群/加订阅者）
#    5200  WebSocket（浏览器 easyjssdk 连接）
#    5300  管理后台（可选）
#    5172  Demo（可选）
#
#  本开发配置关闭 token 强校验（WK_TOKENAUTHON 未设），uid 直接用业务 user.id，
#  token 任意。生产环境务必开启 WK_TOKENAUTHON + WK_MANAGERTOKEN 并通过 API 下发 token。
# ============================================================================
services:
  wukongim:
    image: registry.cn-shanghai.aliyuncs.com/wukongim/wukongim:v2
    container_name: wukongim
    restart: unless-stopped
    environment:
      - "WK_MODE=debug"
      - "WK_CLUSTER_NODEID=1001"
    volumes:
      - ./wukongim_data:/root/wukongim
    ports:
      - "5001:5001"   # HTTP API
      - "5100:5100"   # TCP
      - "5200:5200"   # WebSocket（浏览器连接）
      - "5300:5300"   # 管理后台
      - "5172:5172"   # Demo
    healthcheck:
      test: ["CMD", "wget", "-q", "-Y", "off", "-O", "-", "http://localhost:5001/health"]
      interval: 10s
      timeout: 5s
      retries: 6
